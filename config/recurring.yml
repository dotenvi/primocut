# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Competitor snapshot cadences (the PoC rq-scheduler process is gone):
  #   all    → re-snapshot every video of every active channel, once a day;
  #   recent → re-snapshot only videos within `recent_days`, every 6 hours.
  competitor_snapshot_all:
    class: Competitors::SnapshotCycleJob
    args: [ "all" ]
    schedule: every day at 4am
  competitor_snapshot_recent:
    class: Competitors::SnapshotCycleJob
    args: [ "recent" ]
    schedule: every 6 hours
